name: maaso
description: "Open-source embodied AI workspace with voice, avatar, generated apps, and device skills."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1
  dio: ^5.9.2
  intl: ^0.20.2
  flutter_js: ^0.8.7
  path_provider: ^2.1.5
  logger: ^2.7.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.6.0
  json_annotation: ^4.9.0
  battery_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  http: ^1.6.0
  uuid: 4.6.0
  html: ^0.15.6
  xml: ^7.0.1
  web: ^1.1.1
  crypto: ^3.0.6
  cryptography: 2.9.0
  # Stable file_picker releases pin win32 5.x, which conflicts with the
  # existing package_info_plus win32 6.x dependency. This prerelease is
  # compatible with the app's Flutter 3.44 / Dart 3.12 toolchain.
  file_picker: 12.0.0-beta.7
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.2
  package_info_plus: ^10.1.0
  path: ^1.9.1
  flutter_timezone: ^5.0.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  # Embedded persistence — replaced isar (unmaintained, AGP/build hassle) with
  # sembast (pure Dart, no native code, no codegen).
  sembast: ^3.8.7
  # IndexedDB backend used by Sembast when running in a browser.
  sembast_web: 2.4.4+1

  # Generated surface rendering.
  webview_flutter: ^4.14.0
  # Access the existing iOS player's public snapshot identifier.
  webview_flutter_wkwebview: ^3.26.0
  webview_flutter_android: ^4.13.0

  # 蓝牙硬件技能 (BLE 传输层 + 各设备协议). flutter_blue_plus 做 GATT 连接 /
  # 扫描 / 分包写; image 做投图前的缩放 + JPEG 编码 (设备协议要 JPEG 帧).
  flutter_blue_plus: ^2.3.11
  image: ^4.8.0
  # 官方投影仪 applet 的相册选图.
  image_picker: ^1.1.2
  # 前置摄像头帧采样 + 人脸/情绪检测 (MVP：本地推理，不上云)
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.14.0

  # P2.5 on-device LLM — drives the LocalBrainService routing decisions
  # when the user opts in (Settings → On-Device Brain). Pulls a Q4 GGUF
  # from HuggingFace on first enable (~1 GB). Native build needs:
  #   • iOS 16.4+ deployment target
  #   • Android NDK r25+ (Metal / Vulkan acceleration optional)
  # The companion package links the matching llama.cpp XCFramework on Apple
  # platforms through Swift Package Manager.
  llamadart: ^0.8.17
  llamadart_llama_cpp_flutter: ^0.0.11

  # P3 speech stack — Supertonic 3 local TTS + Silero VAD powered by
  # sherpa-onnx (k2-fsa). Native iOS/Android speech recognition handles ASR.
  # Replaces the legacy supertonic_flutter dependency. Pulls platform-specific native libs
  # (~30-50 MB per arch) on first build.  iOS 13+ / Android NDK r23+.
  # Models live in app docs dir under sherpa_models/. Silero VAD ships in the
  # app bundle; larger optional models download on demand (see registry).
  sherpa_onnx: ^1.13.3

  # Used by TTS-2 to extract sherpa_onnx-supertonic-3-tts-int8-*.tar.bz2.
  # Pure Dart, no native code.
  archive: ^4.0.7

  # Mic capture — streams 16-bit PCM frames into VadService and waveform UI.
  # Requires platform permission entries:
  #   • iOS  Info.plist: NSMicrophoneUsageDescription
  #   • Android  AndroidManifest: <uses-permission android:name="android.permission.RECORD_AUDIO"/>
  record: ^7.1.1
  volc_engine_rtc: ^3.60.4
  # 聊天视频附件使用最小 LGPL FFmpeg 构建处理本地媒体。
  # H.264/AAC MP4；video_player 负责聊天媒体与商店素材预览。
  ffmpeg_kit_flutter_new_min: ^3.6.2
  video_player: ^2.11.1
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  screen_retriever: ^0.2.2

  url_launcher: 6.3.2
# Explicit invocation data-store/profile constructors; ordinary defaults unchanged.
dependency_overrides:
  webview_flutter_wkwebview:
    path: third_party/webview_flutter_wkwebview
  webview_flutter_android:
    path: third_party/webview_flutter_android

dev_dependencies:
  analyzer: 12.1.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  video_player_platform_interface: ^6.9.0
  # isar_generator and json_serializable are intentionally omitted —
  # their source_gen constraints conflict. Re-add behind a separate
  # workspace if codegen is needed; .g.dart files are committed.

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/masso_splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/brand/masso_android12_splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/masso_launcher_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/masso_launcher_foreground.png
  web:
    generate: true
    image_path: assets/brand/masso_launcher_icon.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  macos:
    generate: true
    image_path: assets/brand/masso_macos_app_icon.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: MaasoOrbitron
      fonts:
        - asset: assets/fonts/Orbitron/Orbitron-Variable.ttf

  assets:
    - assets/game_companion/observer_v1.js
    - assets/project_runtime/maaso_project_sdk_v2.js
    # Runtime artwork only; launcher/splash masters remain build-tool inputs.
    - assets/brand/home_room.png
    - assets/brand/login_doorway.png
    - assets/brand/masso_launcher_foreground.png
    - assets/brand/masso_macos_status_icon.png
    - assets/fonts/Orbitron/OFL.txt
    - assets/model_store/agent.png
    - assets/sherpa_models/silero-vad-v5/silero_vad.onnx

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
